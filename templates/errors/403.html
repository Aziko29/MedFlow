<!-- templates/errors/403.html -->
{% extends "base.html" %}
{% block title %}Kirish taqiqlangan{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; justify-content:center; min-height:70vh;">
    <div class="card" style="max-width:440px; width:100%; text-align:center; padding:40px 32px; border-radius:14px;">
        <div style="width:72px; height:72px; margin:0 auto 20px; border-radius:50%;
                    background-color: color-mix(in srgb, var(--danger-color) 15%, transparent);
                    display:flex; align-items:center; justify-content:center;">
            <i class="fa-solid fa-lock" style="font-size:28px; color: var(--danger-color);"></i>
        </div>
        <div style="font-size:52px; font-weight:800; color: var(--danger-color); line-height:1;">403</div>
        <h2 style="margin:14px 0 8px; color: var(--text-primary); font-size:20px;">Sizda bu bo'limga kirish huquqi yo'q</h2>
        <p style="color: var(--text-secondary); font-size:14px; line-height:1.6; margin:0 0 24px;">
            Ushbu sahifa yoki amal joriy rolingiz uchun cheklangan.<br>
            Joriy rolingiz: <strong style="color: var(--text-primary);">{{ current_user.role }}</strong>
        </p>
        <a href="/dashboard" class="btn btn-primary-action" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; padding:10px 22px; border-radius:8px;">
            <i class="fa-solid fa-house"></i> Bosh sahifaga qaytish
        </a>
    </div>
</div>
{% endblock %}
