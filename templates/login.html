<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish · ClinicFlow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.18), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 229, 255, 0.14), transparent 45%),
                #05070d;
            overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background-image: linear-gradient(rgba(0,229,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.035) 1px, transparent 1px);
            background-size: 42px 42px; animation: gridMove 18s linear infinite;
        }
        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 42px 42px; } }
        .login-card {
            background: rgba(15, 23, 36, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0,229,255,0.18); padding: 40px; width: 380px; position: relative; z-index: 1;
            clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
            box-shadow: 0 0 50px rgba(0,229,255,0.12), 0 25px 50px rgba(0,0,0,0.5);
            animation: cardIn 0.5s ease;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #e6f1ff; font-family: 'Space Grotesk', sans-serif; }
        .brand i { color: #00e5ff; text-shadow: 0 0 12px rgba(0,229,255,0.6); }
        .subtitle { color: #7c8aa8; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; font-weight: 500; color: #e6f1ff; }
        .form-group input {
            padding: 12px 14px; border: 1px solid rgba(0,229,255,0.18); border-radius: 4px; font-size: 14px;
            font-family: inherit; background: rgba(255,255,255,0.03); color: #e6f1ff;
        }
        .form-group input:focus { border-color: #00e5ff; outline: none; box-shadow: 0 0 12px rgba(0,229,255,0.35); }
        .form-error { display: none; background: rgba(255,61,110,0.12); color: #ff6b8f; padding: 10px 14px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; border: 1px solid rgba(255,61,110,0.3); }
        .btn-login {
            background: #00e5ff; color: #04121a; border: none; width: 100%; padding: 13px;
            border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 15px; letter-spacing: 0.02em;
            box-shadow: 0 0 18px rgba(0,229,255,0.35); transition: all 0.2s;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }
        .btn-login:hover { background: #33ecff; box-shadow: 0 0 26px rgba(0,229,255,0.55); transform: translateY(-1px); }
        .btn-login:disabled { background: #4a5670; box-shadow: none; cursor: not-allowed; }
        .forgot-link-row { text-align: right; margin-top: -8px; margin-bottom: 18px; }
        .forgot-link-row a {
            color: #7c8aa8; font-size: 13px; text-decoration: none; transition: color 0.15s;
        }
        .forgot-link-row a:hover { color: #00e5ff; text-decoration: underline; }

        /* Modal: Parolni unutdingizmi? */
        .fp-modal {
            display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center;
            background: rgba(2, 6, 12, 0.65); backdrop-filter: blur(4px);
        }
        .fp-modal.open { display: flex; }
        .fp-modal-content {
            background: rgba(15, 23, 36, 0.92); border: 1px solid rgba(0,229,255,0.18);
            padding: 28px; width: 340px; position: relative;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            box-shadow: 0 0 40px rgba(0,229,255,0.15), 0 20px 40px rgba(0,0,0,0.5);
            animation: cardIn 0.25s ease;
        }
        .fp-modal-content h3 { color: #e6f1ff; font-size: 17px; margin-bottom: 10px; font-family: 'Space Grotesk', sans-serif; }
        .fp-modal-content h3 i { color: #00e5ff; margin-right: 6px; }
        .fp-modal-content p { color: #9fb0c9; font-size: 13.5px; line-height: 1.6; margin-bottom: 20px; }
        .fp-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .fp-btn-secondary {
            background: transparent; color: #9fb0c9; border: 1px solid rgba(255,255,255,0.12);
            padding: 9px 16px; border-radius: 4px; font-size: 13.5px; cursor: pointer; font-family: inherit;
        }
        .fp-btn-secondary:hover { border-color: rgba(255,255,255,0.3); color: #e6f1ff; }
        .fp-btn-primary {
            background: #00e5ff; color: #04121a; border: none; padding: 9px 16px; border-radius: 4px;
            font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
        }
        .fp-btn-primary:hover { background: #33ecff; }
        .fp-btn-primary:disabled { background: #4a5670; cursor: not-allowed; }
        .fp-modal-close { position: absolute; top: 12px; right: 14px; color: #7c8aa8; cursor: pointer; font-size: 15px; background: none; border: none; }
        .fp-modal-close:hover { color: #e6f1ff; }
        .fp-success { display: none; color: #00e5ff; font-size: 13px; margin-top: 10px; }
        .fp-success.show { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand"><i class="fa-solid fa-heart-pulse"></i> ClinicFlow</div>
        <div class="subtitle">Tizimga kirish uchun login va parolingizni kiriting</div>
        <div id="loginError" class="form-error"></div>
        <form id="loginForm" onsubmit="submitLogin(event)" autocomplete="off">
            <div class="form-group">
                <label for="username">Login:</label>
                <input type="text" id="username" required autofocus autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Parol:</label>
                <input type="password" id="password" required autocomplete="off">
            </div>
            <div class="forgot-link-row">
                <a href="#" id="forgotPasswordLink">Parolni unutdingizmi?</a>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Kirish</button>
        </form>
    </div>

    <!-- ═══════════════ MODAL: Parolni unutdingizmi? ═══════════════ -->
    <div id="forgotPasswordModal" class="fp-modal">
        <div class="fp-modal-content">
            <button type="button" class="fp-modal-close" id="fpModalCloseBtn" aria-label="Yopish">&times;</button>
            <h3><i class="fa-solid fa-circle-info"></i>Parolni tiklash</h3>
            <p>
                Xavfsizlik sabablari tufayli parolni tizim orqali mustaqil tiklab bo'lmaydi.
                Administratorga murojaat qiling — u sizga vaqtinchalik parol beradi.
            </p>
            <div class="fp-modal-actions">
                <button type="button" class="fp-btn-secondary" id="fpCancelBtn">Yopish</button>
                <button type="button" class="fp-btn-primary" id="fpNotifyBtn">So'rov yuborish</button>
            </div>
            <div class="fp-success" id="fpSuccessMsg"></div>
            <div class="form-error" id="fpErrorMsg" style="margin-top: 12px; margin-bottom: 0;"></div>
        </div>
    </div>

    <script src="/static/js/password-toggle.js"></script>
    <script>
        // ⏱️ Frontend inactivity timer /login?reason=timeout ga
        // yo'naltirgan bo'lsa, buni tushunarli xabar bilan ko'rsatamiz.
        (function () {
            const params = new URLSearchParams(window.location.search);
            if (params.get('reason') === 'timeout') {
                const errBox = document.getElementById('loginError');
                errBox.textContent = "15 daqiqa harakatsizlik sababli sessiya avtomatik yakunlandi. Xavfsizlik uchun qayta kiring.";
                errBox.style.display = 'block';
            }
        })();

        async function submitLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('loginError');
            errBox.style.display = 'none';
            btn.disabled = true; btn.textContent = 'Kirilmoqda...';
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const body = await response.json().catch(() => null);
                if (!response.ok) {
                    throw new Error((body && body.detail) || `Xatolik (${response.status})`);
                }
                window.location.href = '/dashboard';
            } catch (err) {
                errBox.textContent = err.message;
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Kirish';
            }
        }
        console.log('%c🛰️ ClinicFlow login terminal — mustahkam parol tanlang!', 'color:#00e5ff;font-weight:bold;');

        // ═══════════════════════════════════════════════════════════
        // "Parolni unutdingizmi?" — administratorga murojaat modali.
        // Tizimda o'z-o'zini parolni tiklash (email/SMS) funksiyasi
        // ATAYLAB yo'q — xavfsizlik siyosati bo'yicha parolni faqat
        // admin, xodimning shaxsini tasdiqlagandan so'ng, qo'lda
        // tiklaydi. "So'rov yuborish" bosilganda POST
        // /api/auth/forgot-password chaqiriladi — bu adminga Xavfsizlik
        // markazida (SecurityMessage) ko'rinadigan xabar yaratadi
        // (qarang: modules/security_center.py -> record_forgot_password_request).
        // ═══════════════════════════════════════════════════════════
        (function () {
            var link = document.getElementById('forgotPasswordLink');
            var modal = document.getElementById('forgotPasswordModal');
            var closeBtn = document.getElementById('fpModalCloseBtn');
            var cancelBtn = document.getElementById('fpCancelBtn');
            var notifyBtn = document.getElementById('fpNotifyBtn');
            var successMsg = document.getElementById('fpSuccessMsg');
            var errorMsg = document.getElementById('fpErrorMsg');

            function openFpModal() {
                successMsg.classList.remove('show');
                successMsg.textContent = '';
                errorMsg.style.display = 'none';
                notifyBtn.disabled = false;
                notifyBtn.textContent = "So'rov yuborish";
                modal.classList.add('open');
            }
            function closeFpModal() {
                modal.classList.remove('open');
            }

            link.addEventListener('click', function (e) {
                e.preventDefault();
                openFpModal();
            });
            closeBtn.addEventListener('click', closeFpModal);
            cancelBtn.addEventListener('click', closeFpModal);
            modal.addEventListener('click', function (e) {
                if (e.target === modal) closeFpModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modal.classList.contains('open')) closeFpModal();
            });

            notifyBtn.addEventListener('click', async function () {
                notifyBtn.disabled = true;
                notifyBtn.textContent = 'Yuborilmoqda...';
                errorMsg.style.display = 'none';
                try {
                    var usernameField = document.getElementById('username');
                    var response = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: (usernameField.value || '').trim() || null
                        })
                    });
                    var body = await response.json().catch(function () { return null; });
                    if (!response.ok) {
                        throw new Error((body && body.detail) || `Xatolik (${response.status})`);
                    }
                    notifyBtn.textContent = 'Yuborildi ✓';
                    successMsg.textContent = body.message;
                    successMsg.classList.add('show');
                } catch (err) {
                    notifyBtn.disabled = false;
                    notifyBtn.textContent = "So'rov yuborish";
                    errorMsg.textContent = err.message || "So'rovni yuborib bo'lmadi. Birozdan so'ng qayta urinib ko'ring.";
                    errorMsg.style.display = 'block';
                }
            });
        })();
    </script>
</body>
</html>
